name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fast feedback: everything that builds without Windows and CEF.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the exact toolchain; rustup reads it.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint (portable crates, warnings denied)
        run: cargo clippy --locked --workspace --all-targets --exclude agentgo-app --exclude agentgo-cef --exclude agentgo-native-win -- -D warnings

      - name: Tests (portable crates)
        run: cargo test --locked --workspace --exclude agentgo-app --exclude agentgo-cef --exclude agentgo-native-win

      - name: UI scripts parse
        run: for f in ui/*.js crates/agentgo-cef/src/runtime/*.js; do node --check "$f"; done

      # zip 2.x advisories RUSTSEC-2026-0367/0368/0369 concern ZipArchive::extract,
      # which AgentGo never calls (entries are unpacked one by one through
      # enclosed_name, links skipped). Remove the ignores once zip is upgraded.
      # The installer's ureq 2 pulls webpki-roots 0.26.11, a shim that only
      # re-exports webpki-roots 1.0.10 (which has the fix for RUSTSEC-2026-0381);
      # the advisory matches its version number. Remove with ureq 3.
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369
          cd installer && cargo audit --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0381

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CEF_PATH: ${{ github.workspace }}\third_party\cef-dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the exact toolchain; rustup reads it.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache CEF distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/cef-dist
          key: cef-${{ hashFiles('scripts/pins.json') }}

      - name: Bootstrap (toolchain + pinned CEF + fetch)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/bootstrap.ps1

      - name: Format check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fmt.ps1

      - name: Lint (clippy, warnings denied)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/lint.ps1

      - name: Tests (unit + integration + conformance)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1

      - name: Doctor (strict)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/doctor.ps1 -Strict

      - name: Release build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1 -Release

      - name: UI scripts parse
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ui\*.js, crates\agentgo-cef\src\runtime\*.js) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($file.Name) does not parse" }
          }

      - name: Installer (AgentGo Setup)
        shell: pwsh
        working-directory: installer
        run: |
          cargo fmt --check
          cargo clippy --release --locked -- -D warnings
          cargo build --release --locked

      - name: Version report (gate evidence)
        shell: pwsh
        # Without -Runtime the build makes agentgo-tool.exe (agentgo.exe needs the runtime feature).
        run: .\target\release\agentgo-tool.exe version
