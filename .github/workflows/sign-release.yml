name: Sign release (Sigstore Cosign)

# Signs every file of a published release with Sigstore Cosign, keyless:
# the signature is bound to this workflow in this repository through
# GitHub's OIDC identity and recorded in the public Rekor transparency log.
# Each file gets a <file>.sigstore.json bundle next to it on the release.
#
# Verify a download (see docs/verify-release.md):
#   cosign verify-blob AgentGo-Setup.exe --bundle AgentGo-Setup.exe.sigstore.json \
#     --certificate-identity-regexp "^https://github.com/Moha2005269/agentgo/.github/workflows/sign-release.yml@" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (for example v0.1.4)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Download release files
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f *.sigstore.json
          ls -l

      - name: Sign each file
        working-directory: assets
        run: |
          for file in *; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Check the signatures
        working-directory: assets
        run: |
          for file in $(ls | grep -v '\.sigstore\.json$'); do
            cosign verify-blob "$file" --bundle "$file.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Attach the signatures to the release
        working-directory: assets
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.sigstore.json
