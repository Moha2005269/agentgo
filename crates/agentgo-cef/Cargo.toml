[package]
name = "agentgo-cef"
description = "AgentGo CEF runtime adapter: version pins and binary-distribution verification (runtime wiring lands in Milestone 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Enables the real cef-rs dependency and the runtime module. Milestone 0
# builds stay fast; the Milestone 1 spike enables this and compiles the
# CEF C++ wrapper.
runtime = [
    "dep:cef",
    "dep:serde_json",
    "dep:agentgo-policy",
    "dep:agentgo-protocol",
    "dep:agentgo-shell-bridge",
    "dep:agentgo-storage",
    "dep:agentgo-session",
    "dep:agentgo-artifacts",
    "dep:getrandom",
    "dep:agentgo-accounts",
    "dep:agentgo-adblock",
    "dep:ring",
    "dep:zip",
    "dep:agentgo-import",
    "dep:agentgo-gomini",
]
# Windows sandbox build: the app is bundled behind CEF's bootstrap.exe
# launcher (cefsimple model) and links cef_sandbox.lib.
sandbox = ["runtime", "cef/sandbox"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
agentgo-accounts = { workspace = true, optional = true }
agentgo-adblock = { workspace = true, optional = true }
agentgo-import = { workspace = true, optional = true }
agentgo-gomini = { workspace = true, optional = true }
agentgo-policy = { workspace = true, optional = true }
agentgo-protocol = { workspace = true, optional = true }
agentgo-shell-bridge = { workspace = true, optional = true }
agentgo-storage = { workspace = true, optional = true }
agentgo-session = { workspace = true, optional = true }
agentgo-artifacts = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
cef = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
