<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="AgentGo 0.1.5 to 0.1.6: what the benchmark fixed">
<title>AgentGo 0.1.5 to 0.1.6: what the benchmark fixed</title>
<defs>
<radialGradient id="glow" cx="12%" cy="0%" r="70%"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".22"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
<rect width="1200" height="540" rx="24" fill="#0e0d0c"/>
<rect width="1200" height="540" rx="24" fill="url(#glow)"/>
<rect width="1200" height="540" rx="24" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="539" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="56" y="62" fill="#ff6a2b" font-size="13" font-weight="700" letter-spacing="2.4">AGENTGO 0.1.5 → 0.1.6</text><text x="56" y="104" fill="#f4f0e8" font-size="32" font-weight="600" letter-spacing="-.5">What the benchmark fixed</text><text x="56" y="134" fill="#a39a8e" font-size="15">Every number measured on the same tasks before and after · docs/benchmarks/agentgo-0.1.6.md</text>
<g class="fade" style="animation-delay:0.10s"><rect x="56" y="186" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="78" y="220" fill="#a39a8e" font-size="14">Wrong item after a list re-render</text><text x="78" y="270" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">0/4</text><text x="144" y="270" fill="#6f675e" font-size="26">→</text><text x="182" y="272" fill="#ff6a2b" font-size="42" font-weight="700">4/4</text><text x="78" y="316" fill="#6f675e" font-size="12">React key={index} inbox, right notification</text></g>
<g class="fade" style="animation-delay:0.22s"><rect x="424" y="186" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="446" y="220" fill="#a39a8e" font-size="14">Input tokens, 300-row virtual list</text><text x="446" y="270" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">249k</text><text x="530" y="270" fill="#6f675e" font-size="26">→</text><text x="568" y="272" fill="#ff6a2b" font-size="42" font-weight="700">59k</text><text x="446" y="316" fill="#6f675e" font-size="12">per task, AgentGo alone</text></g>
<g class="fade" style="animation-delay:0.34s"><rect x="792" y="186" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="814" y="220" fill="#a39a8e" font-size="14">Wrong actions in the agent benchmark</text><text x="814" y="270" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">6</text><text x="845" y="270" fill="#6f675e" font-size="26">→</text><text x="883" y="272" fill="#ff6a2b" font-size="42" font-weight="700">0</text><text x="814" y="316" fill="#6f675e" font-size="12">76 runs with GoMini, 38 tasks</text></g>
<g class="fade" style="animation-delay:0.46s"><rect x="56" y="356" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="78" y="390" fill="#a39a8e" font-size="14">Calls to reach an item in a long list</text><text x="78" y="440" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">32</text><text x="127" y="440" fill="#6f675e" font-size="26">→</text><text x="165" y="442" fill="#ff6a2b" font-size="42" font-weight="700">1</text><text x="78" y="486" fill="#6f675e" font-size="12">browser_act scroll until a text shows</text></g>
<g class="fade" style="animation-delay:0.58s"><rect x="424" y="356" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="446" y="390" fill="#a39a8e" font-size="14">GoMini subgoals finished</text><text x="446" y="440" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">39</text><text x="495" y="440" fill="#6f675e" font-size="26">→</text><text x="533" y="442" fill="#ff6a2b" font-size="42" font-weight="700">53</text><text x="446" y="486" fill="#6f675e" font-size="12">of 65 held-out MiniWoB++ subgoals</text></g>
<g class="fade" style="animation-delay:0.70s"><rect x="792" y="356" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="814" y="390" fill="#a39a8e" font-size="14">GoMini right step, held-out pages</text><text x="814" y="440" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">76.6%</text><text x="915" y="440" fill="#6f675e" font-size="26">→</text><text x="953" y="442" fill="#ff6a2b" font-size="42" font-weight="700">96.6%</text><text x="814" y="486" fill="#6f675e" font-size="12">GoMini v5 to v6</text></g>
</svg>
