<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="AgentGo 0.1.4 to 0.1.5: what the benchmark fixed">
<title>AgentGo 0.1.4 to 0.1.5: what the benchmark fixed</title>
<defs>
<radialGradient id="glow" cx="12%" cy="0%" r="70%"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".22"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
.mono{font-family:'Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.22,.8,.2,1) both}
.fade{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.grow,.fade,.pulse,.sweep{animation:none}}
</style>
<rect width="1200" height="540" rx="24" fill="#0e0d0c"/>
<rect width="1200" height="540" rx="24" fill="url(#glow)"/>
<rect width="1200" height="540" rx="24" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="539" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="56" y="62" fill="#ff6a2b" font-size="13" font-weight="700" letter-spacing="2.4">AGENTGO 0.1.4 → 0.1.5</text><text x="56" y="104" fill="#f4f0e8" font-size="32" font-weight="600" letter-spacing="-.5">What the benchmark fixed</text><text x="56" y="134" fill="#a39a8e" font-size="15">Every number measured on the same pages before and after · docs/benchmarks/agentgo-0.1.5.md</text>
<g class="fade" style="animation-delay:0.10s"><rect x="56" y="186" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="78" y="220" fill="#a39a8e" font-size="14">First outline was an empty page</text><text x="78" y="270" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">130</text><text x="148" y="270" fill="#6f675e" font-size="26">→</text><text x="186" y="272" fill="#ff6a2b" font-size="42" font-weight="700">0</text><text x="78" y="316" fill="#6f675e" font-size="12">of 130 MiniWoB++ pages</text></g>
<g class="fade" style="animation-delay:0.22s"><rect x="424" y="186" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="446" y="220" fill="#a39a8e" font-size="14">Pages with no control found</text><text x="446" y="270" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">13</text><text x="498" y="270" fill="#6f675e" font-size="26">→</text><text x="536" y="272" fill="#ff6a2b" font-size="42" font-weight="700">0</text><text x="446" y="316" fill="#6f675e" font-size="12">script-driven icons now listed</text></g>
<g class="fade" style="animation-delay:0.34s"><rect x="792" y="186" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="814" y="220" fill="#a39a8e" font-size="14">Field kinds filled correctly</text><text x="814" y="270" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">15</text><text x="866" y="270" fill="#6f675e" font-size="26">→</text><text x="904" y="272" fill="#ff6a2b" font-size="42" font-weight="700">25</text><text x="814" y="316" fill="#6f675e" font-size="12">of 25 kinds: dates, colours, ranges, typed keys</text></g>
<g class="fade" style="animation-delay:0.46s"><rect x="56" y="356" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="78" y="390" fill="#a39a8e" font-size="14">Real sites answered empty</text><text x="78" y="440" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">4</text><text x="112" y="440" fill="#6f675e" font-size="26">→</text><text x="150" y="442" fill="#ff6a2b" font-size="42" font-weight="700">0</text><text x="78" y="486" fill="#6f675e" font-size="12">browser checks waited out</text></g>
<g class="fade" style="animation-delay:0.58s"><rect x="424" y="356" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="446" y="390" fill="#a39a8e" font-size="14">GoMini subgoals finished</text><text x="446" y="440" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">15</text><text x="498" y="440" fill="#6f675e" font-size="26">→</text><text x="536" y="442" fill="#ff6a2b" font-size="42" font-weight="700">39</text><text x="446" y="486" fill="#6f675e" font-size="12">of 65 held-out MiniWoB++ subgoals</text></g>
<g class="fade" style="animation-delay:0.70s"><rect x="792" y="356" width="344" height="150" rx="16" fill="#1a1816" stroke="#fff" stroke-opacity=".07"/><text x="814" y="390" fill="#a39a8e" font-size="14">GoMini false "done"</text><text x="814" y="440" fill="#6f675e" font-size="30" font-weight="600" text-decoration="line-through">26</text><text x="866" y="440" fill="#6f675e" font-size="26">→</text><text x="904" y="442" fill="#ff6a2b" font-size="42" font-weight="700">3</text><text x="814" y="486" fill="#6f675e" font-size="12">said done when it was not</text></g>
</svg>
