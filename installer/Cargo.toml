[package]
name = "agentgo-setup"
version = "0.1.1"
edition = "2021"
license = "BUSL-1.1"
publish = false
description = "AgentGo Setup: the graphical installer and uninstaller"

# A standalone workspace: the installer is built on its own and never links
# CEF or the browser crates.
[workspace]

[dependencies]
tao = "0.34"
wry = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ureq = "2"
rfd = "0.15"
winreg = "0.55"
agentgo-gomini = { path = "../crates/agentgo-gomini" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
