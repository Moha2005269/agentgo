<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools fixture</title>
<link rel="icon" href="data:,">
<link rel="canonical" href="https://example.com/tools">
<script type="application/ld+json">{"@type":"Product","name":"Widget"}</script>
<style>
  body { font: 15px sans-serif; margin: 0 12px; color: #111; background: #fff; }
  header { position: sticky; top: 0; background: #eee; padding: 4px; }
  #scroller { height: 40px; overflow-y: scroll; }
</style>
</head>
<body>
<header>Fixed bar</header>
<nav aria-label="Main"><a id="docs" href="https://example.com/docs">Docs link</a></nav>
<main>
  <h1>Tools fixture</h1>
  <p id="para">Alpha paragraph with unique words.</p>
  <button id="go" type="button" data-testid="go-button" title="Go title">Go button</button>
  <form id="f">
    <label>Full name <input id="name" name="fullname" required placeholder="Your name"></label>
    <label>Email <input id="email" type="email" name="email" value="bad"></label>
    <label><input id="agree" type="checkbox"> Agree</label>
    <label><input id="small" type="radio" name="size" value="s"> Small</label>
    <label>Color <select id="color"><option>Red</option><option>Blue</option></select></label>
    <input type="file" id="file" aria-label="Attachment">
    <input name="otp" autocomplete="one-time-code" aria-label="Code">
  </form>
  <ul><li>One</li><li>Two</li></ul>
  <img alt="Dot" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  <video id="v" muted width="40" height="20"></video>
  <iframe name="inner" srcdoc="<p>inside</p>" width="100" height="40"></iframe>
  <div id="host"></div>
  <div id="scroller"><div style="height:400px">tall content</div></div>
  <details id="d"><summary>More</summary>Hidden text</details>
  <div aria-live="polite" id="live">Live text</div>
  <div itemscope itemtype="https://schema.org/Thing"><span itemprop="name">Thing name</span></div>
  <canvas width="20" height="20"></canvas>
  <p id="desc">Help text</p>
  <input id="described" aria-describedby="desc" aria-label="Described">
  <a id="cart" role="button" aria-label="Cart, 2 items" style="display:inline-block;width:24px;height:24px;cursor:pointer"></a>
  <span id="sortwrap" style="cursor:pointer"><select id="sort" aria-label="Sort products"><option>A to Z</option></select></span>
  <div role="list"><div role="listitem"><input id="rowcheck" type="checkbox"><span>Water the plants</span></div></div>
  <section id="more" aria-label="More controls">
    <input id="volume" type="range" min="0" max="10" value="2" aria-label="Volume">
    <input id="tint" type="color" value="#000000" aria-label="Tint">
    <input id="day" type="date" aria-label="Day">
    <input id="expiry" type="month" autocomplete="cc-exp" aria-label="Card expiry">
    <div id="editor" contenteditable="true" aria-label="Editor">old text</div>
    <a id="nextpage" rel="next" href="#page2">Next page</a>
    <form id="nosubmit"><input aria-label="Lonely field"></form>
  </section>
</main>
<script>
  document.getElementById("host").attachShadow({ mode: "open" }).innerHTML = "<button class='in'>Shadow button</button>";
</script>
</body>
</html>
