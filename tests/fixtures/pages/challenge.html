<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Challenge fixture</title></head>
<body>
  <h1>Protected area</h1>
  <!-- Stands in for a human-verification widget. Only the human test step
       removes it; the agent must never interact with it. -->
  <div id="challenge" class="g-recaptcha" data-sitekey="fixture">
    <button id="human">I am human</button>
  </div>
  <button id="continue">Continue</button>
  <pre id="log"></pre>
<script>
  const log = (text) => { document.getElementById('log').textContent += text + '\n'; };
  document.getElementById('human').addEventListener('click', () => { document.getElementById('challenge').remove(); log('verified by human'); });
  document.getElementById('continue').addEventListener('click', () => log('continued'));
</script>
</body>
</html>
