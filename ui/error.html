<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page did not load</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing:border-box; margin:0; }
    [hidden] { display:none !important; }
    html,body { height:100%; background:var(--bg); color:var(--ink); font:500 15px/1.6 var(--ui); -webkit-font-smoothing:antialiased; overflow:hidden; }
    main { position:relative; z-index:1; min-height:100%; width:min(760px, calc(100% - 64px)); margin:0 auto; padding:0 0 10vh; display:flex; flex-direction:column; justify-content:center; }
    /* the wire, snapped: two ends spark where it broke */
    .snap { position:fixed; left:0; right:0; top:72%; height:120px; pointer-events:none; z-index:0; }
    .snap svg { width:100%; height:100%; overflow:visible; }
    .snap path { fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; filter:drop-shadow(0 0 8px var(--glow)); }
    .snap .left { animation:sag-l 2.8s var(--inout) infinite alternate; transform-origin:0 50%; }
    .snap .right { animation:sag-r 3.2s var(--inout) infinite alternate; transform-origin:100% 50%; }
    @keyframes sag-l { to { transform:rotate(1.4deg); } }
    @keyframes sag-r { to { transform:rotate(-1.8deg); } }
    .spark { fill:#fff; filter:drop-shadow(0 0 6px var(--accent-hi)); animation:spark 1.1s steps(2) infinite; }
    .spark.b { animation-delay:.37s; }
    @keyframes spark { 0% { opacity:1; } 50% { opacity:.15; } }
    .kicker { display:flex; align-items:center; gap:12px; color:var(--accent); font:600 11px var(--mono); letter-spacing:.3em; text-transform:uppercase; margin-bottom:22px; animation:ag-rise .7s var(--out) both; }
    .kicker::before { content:""; width:18px; height:1px; background:var(--accent); box-shadow:0 0 8px var(--glow); }
    h1 { font:400 clamp(52px, 7vw, 96px)/.95 var(--serif); letter-spacing:-.03em; margin-bottom:22px; padding-bottom:.1em; animation:ag-rise .9s var(--out) .08s both; }
    h1 em { font-style:italic; color:var(--accent); }
    p { color:var(--muted); max-width:520px; overflow-wrap:anywhere; animation:ag-rise .9s var(--out) .16s both; }
    #host { display:inline-block; margin-top:16px; padding:6px 12px; border-radius:9px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); color:var(--ink-2); font:500 12.5px var(--mono); max-width:100%; }
    #host:empty { display:none; }
    .actions { display:flex; align-items:center; gap:18px; margin-top:30px; animation:ag-rise .9s var(--out) .24s both; }
    a.retry { height:46px; padding:0 22px; display:inline-flex; align-items:center; gap:10px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:750; text-decoration:none; box-shadow:0 12px 30px -12px var(--glow); transition:transform var(--mid) var(--spring), background-color var(--fast); }
    a.retry:hover { background:var(--accent-hi); transform:translateY(-2px); }
    a.retry:active { transform:scale(.96); }
    a.retry:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    #code { color:var(--faint); font:500 11px var(--mono); letter-spacing:.1em; }
    /* ---- a dangerous site: the wire is cut on purpose ---- */
    body.danger .snap path { stroke-dasharray:6 10; }
    body.danger .kicker { color:var(--accent); }
    .danger-more { margin-top:18px; font-size:12.5px; color:var(--faint); animation:ag-rise .9s var(--out) .3s both; }
    .danger-more a { color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
    .danger-more a:hover { color:var(--ink); }
    /* ---- offline: a game while the connection is down ---- */
    body.offline main { width:min(1240px, calc(100% - 64px)); display:grid; grid-template-columns:minmax(300px, 1fr) auto; align-items:center; gap:56px; padding:0; }
    body.offline .snap { display:none; }
    .status { display:inline-flex; align-items:center; gap:10px; margin-top:22px; height:34px; padding:0 14px 0 12px; border-radius:99px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); color:var(--muted); font:600 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; }
    .status i { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--glow); animation:ag-pulse 1.2s ease-in-out infinite; }
    .play { display:grid; gap:12px; animation:ag-rise .9s var(--out) .2s both; }
    .hud { display:flex; align-items:center; gap:22px; color:var(--faint); font:600 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
    .hud b { color:var(--ink); font-size:13px; letter-spacing:.08em; margin-left:6px; }
    .lives { margin-left:auto; display:flex; gap:6px; }
    .lives i { width:12px; height:12px; background:var(--ink); clip-path:polygon(0 25%,25% 0,75% 0,100% 25%,55% 50%,100% 75%,75% 100%,25% 100%,0 75%); }
    .board { position:relative; width:min(560px, 46vw); height:min(620px, calc(100dvh - 170px)); display:grid; place-items:center; border-radius:4px; background:var(--bg-2); box-shadow:inset 0 0 0 2px var(--line), 6px 6px 0 color-mix(in srgb,var(--accent) 30%,transparent); }
    #game { outline:0; display:block; }
    .msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); margin:0; padding:10px 16px; border-radius:0; white-space:nowrap; background:var(--surface); box-shadow:inset 0 0 0 2px var(--accent), 4px 4px 0 var(--accent); color:var(--ink); font:600 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; animation:none; }
    .keys { color:var(--faint); font:500 10.5px var(--mono); letter-spacing:.08em; animation:none; }
    .back { position:fixed; left:50%; top:24px; z-index:5; transform:translateX(-50%); display:flex; align-items:center; gap:16px; padding:10px 10px 10px 18px; border-radius:16px; background:var(--accent); color:var(--accent-ink); font-weight:700; box-shadow:0 18px 40px -14px var(--glow); animation:ag-rise .5s var(--spring) both; }
    .back a { height:34px; padding:0 14px; display:inline-flex; align-items:center; border-radius:10px; background:var(--accent-ink); color:var(--accent); text-decoration:none; cursor:pointer; }
    @media (max-width:980px) { body.offline main { grid-template-columns:1fr; } .board { width:min(560px, 100%); } }
  </style>
</head>
<body class="grain">
  <div class="snap" aria-hidden="true">
    <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
      <path class="left" d="M-20 60 C 150 58, 300 62, 430 64 S 470 78, 478 92"/>
      <path class="right" d="M1020 58 C 860 60, 700 56, 580 60 S 532 44, 524 30"/>
      <circle class="spark" cx="478" cy="92" r="2.4"/>
      <circle class="spark b" cx="524" cy="30" r="2.4"/>
    </svg>
  </div>
  <main>
    <div class="copy">
      <div class="kicker">This page did not load</div>
      <h1 id="headline">The wire <em>snapped.</em></h1>
      <p id="reason">The site could not be reached.</p>
      <p><span id="host"></span></p>
      <div class="status" id="status" hidden><i></i><span>Waiting for the connection</span></div>
      <div class="actions">
        <a class="retry" id="retry" hidden>Try again</a>
        <span id="code"></span>
      </div>
    </div>
    <section class="play" id="play" hidden aria-label="Wire-Man, a game while you are offline">
      <div class="hud"><span>Score<b id="gScore">00000</b></span><span>Best<b id="gBest">00000</b></span><span>Level<b id="gLevel">1</b></span><span class="lives" id="gLives"></span></div>
      <div class="board"><canvas id="game" tabindex="0" aria-label="Wire-Man game board"></canvas><p class="msg" id="gMsg"></p></div>
      <p class="keys">Arrows or WASD move · Space pauses · R restarts</p>
    </section>
  </main>
  <div class="back" id="backOnline" hidden><span>You're back online</span><a id="backLink">Return to the page</a></div>
  <script src="theme.js"></script>
  <script src="error.js"></script>
</body>
</html>
